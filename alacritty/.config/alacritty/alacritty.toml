# background_blur = true

import = [
  "~/.config/alacritty/current_colors.toml",
  "~/.config/alacritty/opacity.toml"
]

[font]
size = 11

[font.bold]
family = "Fira Code"
style = "Bold"

[font.bold_italic]
family = "Fira Code"
style = "Bold Italic"

[font.glyph_offset]
x = 0
y = 0

[font.italic]
family = "monospace"
style = "Italic"

[font.normal]
family = "Fira Code"
style = "Regular"

[font.offset]
x = 0
y = 0


